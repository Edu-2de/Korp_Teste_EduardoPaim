<div class="invoice-detail-page" *ngIf="invoice">
  <h2>Nota Fiscal #{{ invoice.number }}</h2>

  <p-tag
    [value]="invoice.status === 'Open' ? 'Aberta' : 'Fechada'"
    [severity]="invoice.status === 'Open' ? 'info' : 'success'"
  />

  <p-message *ngIf="errorMessage" severity="error" [text]="errorMessage" />

  <div class="add-item-section" *ngIf="invoice.status === 'Open'">
    <h3>Adicionar produto</h3>
    <form [formGroup]="itemForm" (ngSubmit)="addItem()" class="item-form">
      <p-select
        formControlName="productId"
        [options]="products()"
        optionLabel="description"
        optionValue="id"
        placeholder="Selecione um produto"
      />
      <p-inputNumber formControlName="quantity" [min]="1" />
      <p-button
        type="submit"
        label="Adicionar"
        [loading]="isAddingItem"
        [disabled]="itemForm.invalid"
      />
    </form>
  </div>

  <h3>Itens da nota</h3>
  <p-table [value]="invoice.items">
    <ng-template pTemplate="header">
      <tr>
        <th>Produto</th>
        <th>Quantidade</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-item>
      <tr>
        <td>{{ item.productId }}</td>
        <td>{{ item.quantity }}</td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="2">Nenhum item adicionado ainda.</td>
      </tr>
    </ng-template>
  </p-table>

  <p-button
    *ngIf="invoice.status === 'Open'"
    label="Imprimir Nota"
    icon="pi pi-print"
    [loading]="isPrinting"
    [disabled]="invoice.items.length === 0"
    (onClick)="printInvoice()"
  />
</div>

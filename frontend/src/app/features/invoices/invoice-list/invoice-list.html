<div class="invoice-page">
  <div class="header">
    <h2>Notas Fiscais</h2>
    <p-button
      label="Nova Nota"
      icon="pi pi-plus"
      [loading]="isCreating"
      (onClick)="createInvoice()"
    />
  </div>

  <p-table [value]="invoices" [loading]="isLoading" [paginator]="true" [rows]="10">
    <ng-template pTemplate="header">
      <tr>
        <th>Número</th>
        <th>Status</th>
        <th>Itens</th>
        <th>Criada em</th>
        <th></th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-invoice>
      <tr>
        <td>{{ invoice.number }}</td>
        <td>
          <p-tag
            [value]="invoice.status === 'Open' ? 'Aberta' : 'Fechada'"
            [severity]="invoice.status === 'Open' ? 'info' : 'success'"
          />
        </td>
        <td>{{ invoice.items.length }}</td>
        <td>{{ invoice.createdAt | date: 'dd/MM/yyyy HH:mm' }}</td>
        <td>
          <p-button label="Abrir" size="small" (onClick)="openInvoice(invoice)" />
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="5">Nenhuma nota fiscal criada ainda.</td>
      </tr>
    </ng-template>
  </p-table>
</div>

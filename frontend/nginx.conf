server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxeia pro Gateway dentro da rede do compose — o browser chama
    # /api/... na mesma origem do front, sem precisar de CORS nem de
    # portas hardcoded no bundle (ver environment.production.ts).
    location /api/ {
        proxy_pass http://gateway:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback de SPA: qualquer rota que não seja um arquivo estático
    # (ex.: /invoices/new após um refresh) cai no index.html, e o Angular
    # Router assume o roteamento no client.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
